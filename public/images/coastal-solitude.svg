<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="100%" height="100%">
  <defs>
    <linearGradient id="coastalSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d5f66"/>
      <stop offset="40%" stop-color="#738c94"/>
      <stop offset="70%" stop-color="#b5c9cf"/>
      <stop offset="90%" stop-color="#dfe8e2"/>
      <stop offset="100%" stop-color="#ecd3d8"/>
    </linearGradient>
    <radialGradient id="cliffGlow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#f7f6f4" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#b5c9cf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4d5f66" stop-opacity="0"/>
    </radialGradient>
    <filter id="linenCoast">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.14 0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#coastalSky)"/>
  <circle cx="600" cy="850" r="700" fill="url(#cliffGlow)"/>

  <!-- Dramatic Coastal Headland Bluff -->
  <path d="M0,780 Q320,720 580,820 T1200,750 L1200,1500 L0,1500 Z" fill="#2d373b" opacity="0.8"/>
  <path d="M0,920 Q420,860 820,950 T1200,890 L1200,1500 L0,1500 Z" fill="#3f4d52" opacity="0.85"/>
  <path d="M0,1100 Q500,1040 1200,1120 L1200,1500 L0,1500 Z" fill="#242c30"/>

  <!-- Breaker Line Shimmer in Alabaster -->
  <ellipse cx="600" cy="1160" rx="480" ry="7" fill="#f7f6f4" opacity="0.6"/>
  <ellipse cx="550" cy="1220" rx="420" ry="6" fill="#dfe8e2" opacity="0.5"/>
  <ellipse cx="680" cy="1290" rx="340" ry="5" fill="#ecd3d8" opacity="0.4"/>
  <ellipse cx="610" cy="1380" rx="240" ry="4" fill="#f7f6f4" opacity="0.3"/>

  <rect width="1200" height="1500" filter="url(#linenCoast)" opacity="0.85" pointer-events="none"/>
</svg>
