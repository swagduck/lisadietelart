<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="100%" height="100%">
  <defs>
    <linearGradient id="dawnSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c4c47"/>
      <stop offset="35%" stop-color="#5f7b6b"/>
      <stop offset="65%" stop-color="#9eb6a8"/>
      <stop offset="85%" stop-color="#dfe8e2"/>
      <stop offset="100%" stop-color="#ecd3d8"/>
    </linearGradient>
    <radialGradient id="mistOrb" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f7f6f4" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#dfe8e2" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#5f7b6b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3c4c47" stop-opacity="0"/>
    </radialGradient>
    <filter id="linenFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.12 0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#dawnSky)"/>
  <circle cx="600" cy="850" r="650" fill="url(#mistOrb)"/>

  <!-- Distant Headland in Mist -->
  <path d="M0,880 Q350,840 700,890 T1200,860 L1200,1500 L0,1500 Z" fill="#4d6156" opacity="0.45"/>
  <path d="M0,980 Q450,920 850,970 T1200,940 L1200,1500 L0,1500 Z" fill="#5f7b6b" opacity="0.6"/>

  <!-- Water Surface Reflections -->
  <path d="M0,1120 Q600,1080 1200,1130 L1200,1500 L0,1500 Z" fill="#2d3833"/>
  <rect x="0" y="1130" width="1200" height="370" fill="#dfe8e2" opacity="0.25"/>

  <!-- Horizontal Dawn Shimmer Bands -->
  <ellipse cx="600" cy="1190" rx="450" ry="6" fill="#f7f6f4" opacity="0.6"/>
  <ellipse cx="560" cy="1250" rx="380" ry="5" fill="#ecd3d8" opacity="0.5"/>
  <ellipse cx="640" cy="1320" rx="280" ry="4" fill="#dfe8e2" opacity="0.5"/>
  <ellipse cx="590" cy="1400" rx="180" ry="3" fill="#f7f6f4" opacity="0.4"/>

  <rect width="1200" height="1500" filter="url(#linenFilter)" opacity="0.85" pointer-events="none"/>
</svg>
